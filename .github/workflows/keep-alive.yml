name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes of inactivity;
# the first request after that takes 30-50+ seconds to wake it back up,
# which staff felt as a slow/stuck login. Pinging /health often enough
# keeps it warm so real logins hit an already-running server.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 60 https://tasmac-project-bvc.onrender.com/health
